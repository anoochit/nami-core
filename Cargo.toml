[package]
name = "nami"
version = "0.9.6"
edition = "2024"

[dependencies]
adk-memory = { version = "0.8.0", features = ["sqlite-memory"] }
adk-runner = "0.8.0"
adk-rust = { version = "0.8.0", features = ["anthropic", "ollama", "openai", "openrouter", "sessions", "cli"] }
adk-session = { version = "0.8.0", features = ["sqlite"] }
adk-telemetry = { version = "0.8.0", features = ["otlp"] }
adk-tool = { version = "0.8.0", features = ["http-transport"] }
sqlx = { version = "0.8.0", features = ["runtime-tokio", "sqlite"] }
tokio-stream = "0.1"
anyhow = "1"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }

reqwest = { version = "0.13.3", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.1"

teloxide = { version = "0.17.0", features = ["macros"] }
urlencoding = "2.1.3"
pretty_env_logger = "0.5.0"
futures = "0.3.32"
clap = { version = "4.6.1", features = ["derive"] }
async-trait = "0.1.89"
log = "0.4.29"
sysinfo = "0.33.1"
termimad = "0.34.1"
rustyline = "18.0.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
regex = "1.10.4"
chrono = "0.4.38"
cron = "0.12"
walkdir = "2.5.0"
yaml-rust = "0.4.5"
toml = "1.1.2"
uuid = { version = "1.23.1", features = ["v4"] }
globset = "0.4.18"
inquire = "0.7.5"
rust-embed = "8.11.0"
mime_guess = "2.0.5"
axum = "0.8.0-rc.1"
tower-http = { version = "0.6.10", features = ["fs", "cors"] }

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
