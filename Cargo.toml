[package]
name = "nami"
version = "0.9.44"
edition = "2024"

[dependencies]
adk-core = { version = "1.0.0" }
adk-memory = { version = "1.0.0", features = ["sqlite-memory"] }
adk-runner = { version = "1.0.0" }
adk-rust = { version = "1.0.0", features = ["anthropic", "ollama", "openai", "openrouter", "sessions", "cli", "gemini", "gemini-vertex", "skills"] }
adk-session = { version = "1.0.0", features = ["sqlite", "postgres"] }
adk-telemetry = { version = "1.0.0", features = ["otlp"] }
adk-tool = { version = "1.0.0", features = ["http-transport"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "postgres"] }
tokio-stream = "0.1"
anyhow = "1"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }

reqwest = { version = "0.13.3", features = ["json", "stream"] }
zip = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1.2.1"
dirs = "6.0.0"

teloxide = { version = "0.17.0", features = ["macros"] }
hmac = "0.13"
sha2 = "0.11"
urlencoding = "2.1.3"
pretty_env_logger = "0.5.0"
futures = "0.3.32"
clap = { version = "4.6.1", features = ["derive"] }
async-trait = "0.1.89"
log = "0.4.29"
sysinfo = "0.39.3"
termimad = "0.34.1"
pulldown-cmark = "0.13.4"
rustyline = "18.0.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
arboard = "3.4.1"
regex = "1.10.4"
chrono = "0.4.38"
cron = "0.16.0"
walkdir = "2.5.0"
yaml-rust = "0.4.5"
toml = "1.1.2"
uuid = { version = "1.23.1", features = ["v4"] }
globset = "0.4.18"
inquire = "0.9.4"
rust-embed = "8.11.0"
mime_guess = "2.0.5"
axum = { version = "0.8.9", features = ["multipart"] }
tower-http = { version = "0.6.10", features = ["fs", "cors"] }
base64 = "0.22.1"
line-bot-sdk-rust = { version = "3.0.0", features = ["axum_support"] }
rustls = { version = "0.23.40", features = ["ring"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand = "0.10.1"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked" # Faster linking on supported platforms
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat" # Performs LTO across all crates in dependency graph for maximum performance
codegen-units = 1
panic = "abort"
strip = "symbols" # Strips symbols and debuginfo from the binary for minimal file size
overflow-checks = false

