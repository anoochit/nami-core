[package]
name = "nami"
version = "0.9.18"
edition = "2024"

[dependencies]
adk-core = { version = "0.8.1"}
adk-memory = { version = "0.8.1", features = ["sqlite-memory"] }
adk-runner = { version = "0.8.1" }
adk-rust = { version = "0.8.1", features = ["anthropic", "ollama", "openai", "openrouter", "sessions", "cli", "gemini", "gemini-vertex"] }
adk-session = { version = "0.8.1", features = ["sqlite"] }
adk-telemetry = { version = "0.8.1", features = ["otlp"] }
adk-tool = {version = "0.8.1", features = ["http-transport"] }
sqlx = { version = "0.8.0", features = ["runtime-tokio", "sqlite"] }
tokio-stream = "0.1"
anyhow = "1"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }

reqwest = { version = "0.13.3", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1.2.1"

teloxide = { version = "0.17.0", features = ["macros"] }
hmac = "0.12"
sha2 = "0.10"
urlencoding = "2.1.3"
pretty_env_logger = "0.5.0"
futures = "0.3.32"
clap = { version = "4.6.1", features = ["derive"] }
async-trait = "0.1.89"
log = "0.4.29"
sysinfo = "0.33.1"
termimad = "0.34.1"
rustyline = "18.0.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
regex = "1.10.4"
chrono = "0.4.38"
cron = "0.12"
walkdir = "2.5.0"
yaml-rust = "0.4.5"
toml = "1.1.2"
uuid = { version = "1.23.1", features = ["v4"] }
globset = "0.4.18"
inquire = "0.7.5"
rust-embed = "8.11.0"
mime_guess = "2.0.5"
axum = { version = "0.8.9", features = ["multipart"] }
tower-http = { version = "0.6.10", features = ["fs", "cors"] }
base64 = "0.22.1"
line-bot-sdk-rust = { version = "3.0.0", features = ["axum_support"] }
rustls = { version = "0.23.40", features = ["ring"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand = "0.10.1"
ratatui = "0.30.0"
textwrap = "0.16.1"
tui-markdown = "0.3.7"
tui-textarea = { package = "tui-textarea-2", version = "0.10.2" }

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
