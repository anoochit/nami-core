name: Daily Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
            extension: ""
          
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
            extension: ""
          
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
            extension: ""
            
          - os: macos-13
            target: x86_64-apple-darwin
            use-cross: false
            extension: ""

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
            extension: ".exe"

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use-cross: false
            extension: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies (native Linux only)
        if: runner.os == 'Linux' && !matrix.use-cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@cross

      - name: Build
        if: '!matrix.use-cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build with cross
        if: matrix.use-cross
        env:
          OPENSSL_VENDORED: "1"
        run: cross build --release --target ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: namiclaw-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/namiclaw${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Flatten and rename: artifacts/namiclaw-<target>/namiclaw[.exe] -> namiclaw-<target>[.exe]
      - name: Rename artifacts for release
        run: |
          mkdir release-files
          for dir in artifacts/namiclaw-*/; do
            target=$(basename "$dir" | sed 's/^namiclaw-//')
            for file in "$dir"*; do
              filename=$(basename "$file")
              ext="${filename##namiclaw}"          # "" or ".exe"
              cp "$file" "release-files/namiclaw-${target}${ext}"
            done
          done
          ls -lh release-files/

      - name: Generate release tag
        id: tag
        run: echo "tag=nightly-$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Delete existing nightly release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.tag.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            release-files/* \
            --title "Nightly Build ${{ steps.tag.outputs.tag }}" \
            --notes "Automated nightly build. Commit: ${{ github.sha }}" \
            --prerelease