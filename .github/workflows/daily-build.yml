name: Daily Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 — native
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
            extension: ""

          # Linux arm64 — native arm64 runner, no cross needed!
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            use-cross: false
            extension: ""

          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
            extension: ""

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
            extension: ".exe"

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use-cross: false
            extension: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        run: make webui

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev

      - name: Build
        run: make build TARGET=${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nami-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nami${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Flatten and rename: artifacts/nami-<target>/nami[.exe] -> nami-<target>[.exe]
      - name: Rename artifacts for release
        run: |
          mkdir release-files
          for dir in artifacts/nami-*/; do
            target=$(basename "$dir" | sed 's/^nami-//')
            for file in "$dir"*; do
              filename=$(basename "$file")
              ext="${filename##nami}"          # "" or ".exe"
              cp "$file" "release-files/nami-${target}${ext}"
            done
          done
          ls -lh release-files/

      - name: Generate release tag
        id: tag
        run: echo "tag=nightly-$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Delete existing nightly release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.tag.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            release-files/* \
            --title "Nightly Build ${{ steps.tag.outputs.tag }}" \
            --notes "Automated nightly build. Commit: ${{ github.sha }}" \
            --prerelease
