[model]
# Provider type: "gemini", "vertex", "openai", "openrouter" or "thaillm"
provider = "vertex"
# The specific model identifier
model_name = "gemini-2.5-flash"
# The environment variable name that holds the API key (see .env.example)
api_key_env = "GOOGLE_API_KEY"

# Vertex AI settings
project_id = "redlinesoft-b7a4f"
location = "global"

# Optional settings for OpenAI-compatible providers
# base_url = "https://api.openai.com/v1"

[commands]
# Example command definitions for the dynamic registry
"/plan" = "plan_create(name='auto', objective='{args}')"
"/wiki" = "wiki_search: {args}"
"/memo" = "add_memory: {args}"